<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#171521">
  <title>篝火ことり — モバイル仮デモ</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171521;
      color: #f4eef7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #171521;
    }

    body { min-height: 100dvh; }

    #kotori-frame {
      display: block;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #171521;
    }

    .setup {
      position: fixed;
      z-index: 9999;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      width: min(330px, calc(100vw - 20px));
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 14px;
      background: rgba(23, 21, 33, .94);
      box-shadow: 0 12px 38px rgba(0, 0, 0, .36);
      backdrop-filter: blur(12px);
    }

    .setup[hidden] { display: none; }

    .setup h1 {
      margin: 0 0 7px;
      font-size: 1rem;
    }

    .setup p {
      margin: 5px 0;
      color: #cfc6d7;
      font-size: .78rem;
      line-height: 1.55;
    }

    .picker {
      display: block;
      margin-top: 9px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .07);
    }

    input[type="file"] {
      width: 100%;
      font-size: .78rem;
    }

    .status {
      margin-top: 9px;
      padding: 8px 9px;
      min-height: 34px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .06);
      font-size: .74rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 9px;
      padding: 9px 10px;
      background: #ede5f4;
      color: #211c2a;
      font-weight: 700;
    }

    button.secondary {
      background: rgba(255, 255, 255, .10);
      color: #f4eef7;
    }

    .reopen {
      position: fixed;
      z-index: 9998;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      width: auto;
      padding: 8px 11px;
      opacity: .82;
    }
  </style>
</head>
<body>
  <iframe
    id="kotori-frame"
    title="篝火ことり 公開Webデモ"
    src="./index.html"
    referrerpolicy="no-referrer"
  ></iframe>

  <section id="setup" class="setup" aria-label="Live2D仮デモ設定">
    <h1>Live2D 仮デモ</h1>
    <p>スマホ内のデモ素材フォルダを選択します。選んだLive2D素材とCubism Coreはこのページ内だけで読み、サーバーへアップロードしません。</p>
    <p>フォルダには <code>*.model3.json</code>、参照先の <code>.moc3</code> / texture、<code>live2dcubismcore.min.js</code>、<code>core-direct-runtime-v2.js</code> を入れてください。</p>

    <label class="picker">
      <span>デモ素材フォルダ</span>
      <input id="asset-picker" type="file" webkitdirectory multiple>
    </label>

    <div id="status" class="status" aria-live="polite">素材未選択。会話UIは下のことり画面をそのまま使えます。</div>

    <div class="actions">
      <button id="close-setup" type="button" class="secondary">閉じる</button>
      <button id="clear-live2d" type="button" class="secondary">Live2D解除</button>
    </div>
  </section>

  <button id="reopen-setup" class="reopen" type="button" hidden>Live2D設定</button>

  <script type="module" src="./mobile-demo.js"></script>
</body>
</html>
