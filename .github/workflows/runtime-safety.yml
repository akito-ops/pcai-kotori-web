name: PCAI Runtime Safety

on:
  push:
    branches:
      - refactor/modular-pcai-core
      - feature/current-self-v1
      - feature/current-self-boot-shadow
      - feature/current-self-readonly-context
      - feature/current-self-reply-selection
      - feature/initiative-shadow-v1
      - feature/initiative-shadow-periodic
      - feature/pending-mind-permission-shadow
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run contract tests
        run: npm test
