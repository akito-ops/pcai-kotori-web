name: PCAI Runtime Safety

on:
  push:
    branches:
      - refactor/modular-pcai-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run contract tests
        run: npm test
