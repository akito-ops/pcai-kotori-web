<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf7ff">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>篝火ことり 見学モード</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="avatar"><img src="./kotori_master.png" alt="篝火ことり 公式ビジュアル"></div>
      <div class="hero-copy">
        <p class="kicker">PCAI GUEST PREVIEW</p>
        <h1>篝火ことり</h1>
        <p class="tagline">見学用の一時セッションです。</p>
        <div class="badges"><span id="guest-status">見学モード</span><span>本人記憶とは分離</span></div>
        <p class="privacy" id="guest-note">このページでは本人用PCAIの長期記憶・アクセス鍵を読み込みません。</p>
      </div>
    </header>

    <section class="grid">
      <section class="chat-card">
        <div id="chat" class="chat" aria-live="polite"></div>
        <form id="chat-form" class="composer">
          <textarea id="message" rows="2" maxlength="400" placeholder="ことりに話しかける…" aria-label="メッセージ"></textarea>
          <button id="send-btn" type="submit" class="send">送信</button>
        </form>
        <div class="quick-actions">
          <button type="button" data-prompt="こんことー！">こんことー！</button>
          <button type="button" data-prompt="自己紹介して">自己紹介</button>
          <button type="button" data-prompt="PCAIって何？">PCAIを聞く</button>
        </div>
      </section>

      <aside class="memory-card">
        <div class="panel-head"><div><p class="kicker">GUEST SESSION</p><h2>一時会話</h2></div></div>
        <p class="privacy">会話内容はこのタブ内だけに保持します。タブを閉じると破棄されます。</p>
      </aside>
    </section>
  </main>
  <script type="module" src="./guest.js"></script>
</body>
</html>
